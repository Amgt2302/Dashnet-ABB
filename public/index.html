<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/asset/img/ABB-icon.png">
  <title>Dashnet | ABB</title>
  <link rel="stylesheet" href="/asset/styles/style.css">
</head>
<body>
  <header>DashNet</header>
  <main class="dashboard" id="dashboard">

    <!-- For Card design test -->
    <div class="card">
      <h3>Test Device ON</h3>
      <p><strong>IP :</strong> 172.16.0.1</p>
      <p><strong>Latence :</strong> 12 ms</p>
      <p><strong>MAC :</strong> AA:BB:CC:DD:EE:FF</p>
    
      <span class="status online">En ligne</span>
    </div>

    <div class="card">
      <h3>Test Device OFF</h3>
      <p><strong>IP :</strong> 172.16.0.2</p>
      <p><strong>Latence :</strong> - ms</p>
      <p><strong>MAC :</strong> N/A</p>
    
      <span class="status offline">Hors ligne</span>
    </div>

  </main>
  <footer>
    &copy; <span id="Auto-Year">2026</span>ABB All rights reserved -
    <img id="ABB-logo" src="/asset/img/ABB_logo.png" alt="ABB logo">
  </footer>
</body>
<script src=""></script>
</html>
